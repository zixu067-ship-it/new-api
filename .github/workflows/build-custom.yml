name: Build and Push Custom Image

on:
  push:
    branches: [main, custom-agent]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/new-api:custom-agent
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          outputs: type=registry
        continue-on-error: true

      - name: Capture build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p /tmp/blog
          docker buildx build --progress=plain --no-cache -t debug-build . > /tmp/blog/buildlog.txt 2>&1 || true
          tail -300 /tmp/blog/buildlog.txt
          echo "=== END LOG ==="

      - name: Upload build log artifact
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: buildlog
          path: /tmp/blog/buildlog.txt

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
